<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Không Một Minh 2026 - Chuyên Sâu Tâm Lý & An Toàn Số</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="ambient-glow"></div>
    
    <div class="app-container">
        <!-- Header chính -->
        <header class="app-header">
            <div class="logo-area">
                <div class="pulse-icon">🛡️</div>
                <div>
                    <h1>Không Một Minh 2026</h1>
                    <p>THPT Nam Trực • Mô Phỏng Thao Túng Tâm Lý & An Toàn Số</p>
                </div>
            </div>
            
            <div class="header-controls">
                <div class="control-group">
                    <label>🎨 Giao diện:</label>
                    <select id="themeSelect">
                        <option value="cyber">Cyberpunk Đêm</option>
                        <option value="neon">Neon Hồng Tím</option>
                        <option value="emerald">Emerald Xanh Lục</option>
                        <option value="sunset">Sunset Cam Hoàng Hôn</option>
                    </select>
                </div>
                
                <div class="control-group">
                    <label>🖼️ Hình nền:</label>
                    <select id="bgSelect">
                        <option value="grid">Lưới Kỹ Thuật Số</option>
                        <option value="matrix">Mã Trận Đêm</option>
                        <option value="gradient">Gradient Động</option>
                        <option value="solid">Tối Giản Tuyệt Đối</option>
                    </select>
                </div>
            </div>
        </header>

        <!-- Màn hình 1: Đăng nhập / Chọn chế độ -->
        <section id="welcome-screen" class="screen active">
            <div class="welcome-card">
                <h2>Cạm Bẫy Mạng & Bản Lĩnh Số</h2>
                <p>Thế giới mạng không chỉ có màu hồng. Những cái bẫy thao túng tâm lý (gaslighting), bạo lực ẩn giấu và hội nhóm độc hại đang chờ sẵn. Liệu cậu có giữ được tỉnh táo?</p>
                
                <div class="input-group">
                    <input type="text" id="playerName" placeholder="Nhập họ tên hoặc biệt danh của cậu..." autocomplete="off">
                </div>

                <div class="mode-selection">
                    <h3>Chọn Chế Độ Thử Thách:</h3>
                    <div class="mode-cards">
                        <button class="mode-btn active" data-mode="standard">
                            <span class="mode-icon">🧠</span>
                            <div>
                                <strong>Tiêu Chuẩn Hack Não</strong>
                                <p>Nhiều đáp án
