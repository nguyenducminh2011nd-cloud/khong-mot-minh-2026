<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Không Một Mình 2026</title>
    
    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-dark: #0d1117;
            --card-bg: rgba(255, 255, 255, 0.05);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-green: #34d399;
            --accent-blue: #60a5fa;
            --text-main: #ffffff;
        }

        body {
            background-color: var(--bg-dark);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            background: linear-gradient(45deg, var(--accent-green), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.3rem;
            margin: 0 0 5px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 800;
        }

        .subtitle {
            color: #9ca3af;
            font-size: 0.9rem;
            margin: 0;
        }

        .main-container {
            width: 100%;
            max-width: 950px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            .main-container { grid-template-columns: 1fr; }
        }

        .card {
            background: var(--card-bg);
            padding: 22px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(10px);
        }

        .card h3 {
            margin-top: 0;
            color: var(--accent-green);
            font-size: 1.1rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Quiz UI */
        .question-box {
            font-size: 1rem;
            margin-bottom: 12px;
            font-weight: 600;
            line-height: 1.4;
            min-height: 50px;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 10px 14px;
            border-radius: 8px;
            text-align: left;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        .option-btn:hover {
            background: rgba(52, 211, 153, 0.2);
            border-color: var(--accent-green);
        }

        .option-btn.correct { background: rgba(52, 211, 153, 0.4) !important; border-color: var(--accent-green) !important; }
        .option-btn.wrong { background: rgba(248, 113, 113, 0.4) !important; border-color: #f87171 !important; }

        .quiz-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        input[type="text"], textarea {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            padding: 10px;
            box-sizing: border-box;
            font-family: inherit;
            margin-bottom: 10px;
        }

        textarea { height: 80px; resize: none; }
        input[type="text"]:focus, textarea:focus { outline: none; border-color: var(--accent-green); }

        .action-btn {
            background: linear-gradient(45deg, var(--accent-green), #10b981);
            color: #000;
            border: none;
            padding: 9px 20px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
            transition: opacity 0.2s;
        }
        .action-btn:hover { opacity: 0.9; }

        .feedback-item {
            background: rgba(0, 0, 0, 0.25);
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            border-left: 3px solid var(--accent-green);
            font-size: 0.9rem;
        }
        .feedback-item strong { color: var(--accent-blue); }

        #global-feedback-list {
            margin-top: 10px;
            max-height: 220px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <header>
        <h1>KHÔNG MỘT MÌNH 2026</h1>
        <p class="subtitle">Hệ thống Ôn tập & Kết nối Cộng đồng</p>
    </header>

    <div class="main-container">
        <!-- BÊN TRÁI: KHU VỰC TRẮC NGHIỆM -->
        <div class="card">
            <h3>🧠 Ôn Tập Trắc Nghiệm</h3>
            <div id="quiz-area">
                <div id="question-counter" style="font-size: 0.8rem; color: #9ca3af; margin-bottom: 6px;"></div>
                <div class="question-box" id="question-text">Đang tải 300 câu hỏi...</div>
                <div class="options-list" id="options-container"></div>
                <div class="quiz-controls">
                    <span id="quiz-score" style="font-weight: bold; color: var(--accent-green); font-size: 0.95rem;">Điểm: 0</span>
                    <button class="action-btn" onclick="nextQuestion()">Câu Tiếp ➡️</button>
                </div>
            </div>
        </div>
