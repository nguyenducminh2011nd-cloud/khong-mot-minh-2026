<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Không Một Minh 2026</title>
    
    <!-- Thư viện Firebase SDK Compat (Bản chạy trực tiếp trên web tĩnh) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>Không Một Minh 2026</h1>
        
        <!-- NÚT ĐĂNG NHẬP GOOGLE -->
        <div id="auth-container" style="margin-bottom: 15px;">
            <button type="button" class="btn-primary" onclick="loginWithGoogle()" style="background: #db4437; border: none; padding: 10px 16px; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;">
                🔐 Đăng Nhập Google Để Lưu Điểm & Đánh Giá Chung
            </button>
        </div>

        <!-- KHU VỰC CHƠI GAME CHÍNH -->
        <div id="game-play-area">
            <!-- Nơi hiển thị câu hỏi, đáp án, 300 kịch bản và bảng điểm của cậu -->
        </div>

        <!-- KHU VỰC ĐÁNH GIÁ TỪ CỘNG ĐỒNG -->
        <div class="feedback-section" style="margin-top: 20px; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px;">
            <h3>💬 Đánh Giá Từ Cộng Đồng</h3>
            <textarea id="home-feedback-input" placeholder="Viết đánh giá của cậu về game..." style="width: 100%; height: 60px; border-radius: 6px; padding: 8px; margin-bottom: 8px; background: rgba(0,0,0,0.2); color: #fff; border: 1px solid rgba(255,255,255,0.2);"></textarea>
            <button onclick="submitHomeFeedback()" style="background: #34d399; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; color: #000;">Gửi Đánh Giá Lên Mây ☁️</button>
            
            <div id="global-feedback-list" style="margin-top: 12px; max-height: 150px; overflow-y: auto; text-align: left; font-size: 13px;">
                <!-- Danh sách đánh giá đồng bộ từ Firestore -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
