<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Không Một Minh 2026</title>
    
    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-dark: #0d1117;
            --card-bg: rgba(255, 255, 255, 0.05);
            --border-glow: rgba(52, 211, 153, 0.3);
            --accent-green: #34d399;
            --accent-blue: #60a5fa;
            --text-main: #ffffff;
        }

        body {
            background-color: var(--bg-dark);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            background: linear-gradient(45deg, var(--accent-green), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.2rem;
            margin: 0 0 5px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .subtitle {
            color: #9ca3af;
            font-size: 0.9rem;
            margin: 0;
        }

        #auth-container {
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
        }

        .google-btn {
            background: #ffffff;
            color: #1f2937;
            border: none;
            padding: 9px 20px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.2s ease;
        }

        .google-btn:hover {
            background: #f3f4f6;
            transform: translateY(-2px);
        }

        .main-container {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(10px);
        }

        .card h3 {
            margin-top: 0;
            color: var(--accent-green);
            font-size: 1.1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 8px;
        }

        /* Quiz Styles */
        .question-box {
            font-size: 1rem;
            margin-bottom: 12px;
            font-weight: 600;
            line-height: 1.4;
            min-height: 50px;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 9px 12px;
            border-radius: 8px;
            text-align: left;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        .option-btn:hover {
            background: rgba(52, 211, 153, 0.2);
            border-color: var(--accent-green);
        }

        .option-btn.correct {
            background: rgba(52, 211, 153, 0.4);
            border-color: var(--accent-green);
        }

        .option-btn.wrong {
            background: rgba(248, 113, 113, 0.4);
            border-color: #f87171;
        }

        .quiz-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        textarea {
            width: 100%;
            height: 75px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: #fff;
            padding: 10px;
            resize: none;
            margin-bottom: 10px;
            box-sizing: border-box;
            font-family: inherit;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent-green);
        }

        .action-btn {
            background: linear-gradient(45deg, var(--accent-green), #10b981);
            color: #000;
            border: none;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
            transition: opacity 0.2s;
        }

        .action-btn:hover {
            opacity: 0.9;
        }

        .feedback-item {
            background: rgba(0, 0, 0, 0.25);
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 6px;
            border-left: 3px solid var(--accent-green);
            font-size: 0.9rem;
        }

        .feedback-item strong {
            color: var(--accent-blue);
        }

        #global-feedback-list {
            margin-top: 10px;
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <header>
        <h1>KHÔNG MỘT MÌNH 2026</h1>
        <p class="subtitle">Hệ thống Ôn tập & Kết nối Cộng đồng</p>
    </header>

    <!-- NÚT ĐĂNG NHẬP GOOGLE -->
    <div id="auth-container">
        <button class="google-btn" onclick="loginWithGoogle()">
            <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.63-.06-1.25-.16-1.84H9v3.49h4.84c-.21 1.12-.86 2.07-1.83 2.71v2.25h2.96c1.73-1.59 2.73-3.93 2.73-6.61z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.96-2.25c-.82.55-1.87.88-3 .88-2.31 0-4.27-1.56-4.97-3.65H1.04v2.32C2.55 15.95 5.58 18 9 18z"/><path fill="#FBBC05" d="M4.03 10.78c-.18-.55-.28-1.13-.28-1.78s.1-1.23.28-1.78V4.9H1.04C.37 6.25 0 7.8 0 9.42s.37 3.17 1.04 4.52l2.99-2.32z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.47.89 11.43 0 9 0 5.58 0 2.55 2.05 1.04 4.9l2.99 2.32c.7-2.09 2.66-3.64 4.97-3.64z"/></svg>
            Đăng Nhập Google
        </button>
    </div>

    <div class="main-container">
        <!-- PHẦN 1: HỆ THỐNG TRẮC NGHIỆM ÔN TẬP -->
        <div class="card">
            <h3>🧠 Ôn Tập Trắc Nghiệm</h3>
            <div id="quiz-area">
                <div id="question-counter" style="font-size: 0.8rem; color: #9ca3af; margin-bottom: 6px;"></div>
                <div class="question-box" id="question-text">Đang tải câu hỏi...</div>
                <div class="options-list" id="options-container"></div>
                <div class="quiz-controls">
                    <span id="quiz-score" style="font-weight: bold; color: var(--accent-green); font-size: 0.95rem;">Điểm: 0</span>
                    <button class="action-btn" onclick="nextQuestion()">Câu Tiếp ➡️</button>
                </div>
            </div>
        </div>

        <!-- PHẦN 2: ĐÁNH GIÁ & GÓP Ý CỘNG ĐỒNG -->
        <div class="card">
            <h3>💬 Đánh Giá & Góp Ý</h3>
            <textarea id="home-feedback-input" placeholder="Viết cảm nhận hoặc góp ý của cậu..."></textarea>
            <button class="action-btn" onclick="submitHomeFeedback()" style="width: 100%;">Gửi Lên Mây ☁️</button>

            <div id="global-feedback-list">
                Đang tải đánh giá...
            </div>
        </div>
    </div>

    <script>
        // --- FIREBASE CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyCtQSv6-wGiKyzIIzpmdL32f00Lz14ih1M",
            authDomain: "khongmotminh2026.firebaseapp.com",
            projectId: "khongmotminh2026",
            storageBucket: "khongmotminh2026.fireappstorage.app",
            messagingSenderId: "391078149804",
            appId: "1:391078149804:web:9ba69127156c66e6966909",
            measurementId: "G-BFXSCXN4Q0"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();
        let currentUser = null;

        // --- GOOGLE AUTHENTICATION ---
        window.loginWithGoogle = function() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).then((result) => {
                console.log("Đăng nhập thành công:", result.user);
            }).catch((error) => {
                console.error("Lỗi đăng nhập:", error);
                alert("Lỗi đăng nhập: " + error.message);
            });
        };

        // --- KHO CÂU HỎI ĐỘC LẬP (KHÔNG DÙNG THUẬT TOÁN TẠO LẶP) ---
        // Cậu có thể thoải mái thêm các câu hỏi thực tế của mình vào danh sách này
        const questionBank = [
            {
                q: "Đâu là thành phần cốt lõi để khởi tạo ứng dụng Firebase trong JavaScript?",
                options: ["firebase.initializeApp()", "firebase.start()", "firebase.run()", "firebase.init()"],
                correct: 0
            },
            {
                q: "Phương thức nào dùng để xác thực người dùng qua popup với Google trong Firebase Auth?",
                options: ["auth.loginPopup()", "auth.signInWithPopup()", "auth.googleLogin()", "auth.popupAuth()"],
                correct: 1
            },
            {
                q: "Trong Firestore, lệnh nào dùng để thêm một bản ghi mới vào collection?",
                options: ["db.collection().add()", "db.insert()", "db.pushData()", "db.createDoc()"],
                correct: 0
            },
            {
                q: "Khi lưu trữ trang web tĩnh lên GitHub Pages, file khởi tạo giao diện bắt buộc phải đặt tên là gì?",
                options: ["main.html", "home.html", "index.html", "app.html"],
                correct: 2
            },
            {
                q: "Thuộc tính 'apiKey' trong cấu hình Firebase dùng để làm gì?",
                options: ["Nhận diện dự án với Google Cloud", "Mã hóa mật khẩu tài khoản", "Bảo mật cơ sở dữ liệu", "Tăng tốc độ kết nối mạng"],
                correct: 0
            }
        ];

        let currentQIndex = 0;
        let score = 0;
        let answered = false;

        function loadQuestion() {
            answered = false;
            let qData = questionBank[currentQIndex];
            document.getElementById('question-counter').innerText = `Câu hỏi ${currentQIndex + 1} / ${questionBank.length}`;
            document.getElementById('question-text').innerText = qData.q;
            
            let optHtml = "";
            qData.options.forEach((opt, idx) => {
                optHtml += `<button class="option-btn" onclick="checkAnswer(${idx}, ${qData.correct})">${String.fromCharCode(65 + idx)}. ${opt}</button>`;
            });
            document.getElementById('options-container').innerHTML = optHtml;
        }

        window.checkAnswer = function(selected, correct) {
            if (answered) return;
            answered = true;
            let buttons = document.querySelectorAll('#options-container .option-btn');
            
            if (selected === correct) {
                buttons[selected].classList.add('correct');
                score += 10;
                document.getElementById('quiz-score').innerText = `Điểm: ${score}`;
            } else {
                buttons[selected].classList.add('wrong');
                buttons[correct].classList.add('correct');
            }
        };

        window.nextQuestion = function() {
            currentQIndex = (currentQIndex + 1) % questionBank.length;
            loadQuestion();
        };

        // --- SUBMIT FEEDBACK TO FIRESTORE ---
        window.submitHomeFeedback = function() {
            const input = document.getElementById('home-feedback-input');
            const text = input ? input.value.trim() : "";
            
            if (!text) {
                alert("Cậu vui lòng viết vài dòng đánh giá trước khi gửi nhé!");
                return;
            }

            let authorName = currentUser && currentUser.displayName ? currentUser.displayName : "Khách ẩn danh";

            db.collection("feedbacks").add({
                name: authorName,
                text: text,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                input.value = "";
                alert("❤️ Cảm ơn cậu đã gửi đánh giá!");
                loadGlobalFeedbacks();
            }).catch((error) => {
                console.error("Lỗi gửi đánh giá:", error);
                alert("Không thể gửi đánh giá do thiếu quyền hoặc lỗi mạng!");
            });
        };

        function loadGlobalFeedbacks() {
            const listContainer = document.getElementById('global-feedback-list');
            if (!listContainer) return;

            db.collection("feedbacks").orderBy("timestamp", "desc").limit(5).get()
                .then((querySnapshot) => {
                    let html = "";
                    querySnapshot.forEach((doc) => {
                        let data = doc.data();
                        html += `<div class="feedback-item">
                            <strong>${data.name || "Khách"}:</strong> ${data.text}
                        </div>`;
                    });
                    listContainer.innerHTML = html || "<div style='color: #888; text-align: center; font-size: 0.85rem;'>Chưa có đánh giá nào.</div>";
                }).catch((err) => {
                    console.log("Lỗi tải đánh giá:", err);
                    listContainer.innerHTML = "<div style='color: #888; text-align: center; font-size: 0.85rem;'>Chưa thể tải dữ liệu từ Firestore.</div>";
                });
        }

        // --- AUTH STATE MONITOR ---
        auth.onAuthStateChanged((user) => {
            const authContainer = document.getElementById('auth-container');
            if (user) {
                currentUser = user;
                if (authContainer) {
                    authContainer.innerHTML = `
                        <div style="display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,0.8); padding: 8px 18px; border-radius: 30px; border: 1px solid var(--border-glow);">
                            <img src="${user.photoURL}" style="width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--accent-green);">
                            <div style="text-align: left; font-size: 13px; color: #fff;">
                                <strong>${user.displayName}</strong><br>
                                <span style="font-size: 10px; color: var(--accent-green);">Đã kết nối Cloud 🛡️</span>
                            </div>
                        </div>
                    `;
                }
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            loadQuestion();
            loadGlobalFeedbacks();
        });
    </script>
</body>
</html>
