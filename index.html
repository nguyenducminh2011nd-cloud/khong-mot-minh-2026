<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check-in An Toàn Mạng - Không Một Mình 2026</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="background-decor"></div>
  
  <main class="phone-container">
    <!-- Header điện thoại -->
    <header class="phone-header">
      <div class="notch"></div>
      <div class="chat-user-info">
        <div class="avatar">🛡️</div>
        <div>
          <h2>Cyber Guard Nam Trực</h2>
          <span class="status-dot">● Trực tuyến</span>
        </div>
      </div>
    </header>

    <!-- Màn hình Chat -->
    <section id="chat-box" class="chat-box">
      <div class="message system">
        Chào mừng bạn đến với <b>Chiến dịch "Không Một Mình 2026"</b>! Hãy cùng kiểm tra độ tỉnh táo trên không gian mạng nhé.
      </div>
    </section>

    <!-- Màn hình Kết quả (Mặc định ẩn) -->
    <section id="result-screen" class="result-screen hidden">
      <h2 id="result-title">Cáo Già Cyber</h2>
      <p id="result-badge">🏆 Score: 100/100</p>
      <p id="result-desc">Tỉnh táo lắm! Lừa đảo tuổi gì chọc tới bạn.</p>
      <button class="btn-restart" onclick="restartGame()">Chơi lại</button>
    </section>

    <!-- Khung lựa chọn trả lời -->
    <footer id="options-box" class="options-box">
      <!-- Các nút bấm lựa chọn sẽ xuất hiện ở đây -->
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
