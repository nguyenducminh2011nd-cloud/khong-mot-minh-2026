<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Không Một Mình 2026</title>
    
    <!-- Thư viện Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <link rel="stylesheet" href="style.css">
    
    <style>
        body {
            background-color: #0d1117;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .game-container {
            max-width: 700px;
            margin: 0 auto;
            text-align: center;
        }
        /* TIÊU ĐỀ CHUẨN ĐÚNG TÊN KHÔNG MỘT MÌNH 2026 VÀ CÓ HIỆU ỨNG PHÁT SÁNG */
        .game-title {
            font-size: 2.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, #34d399, #3b82f6, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(52, 211, 153, 0.3);
            margin: 40px 0 30px 0;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body style="position: relative;">
    
    <!-- NÚT ĐĂNG NHẬP GOOGLE CỐ ĐỊNH GÓC PHẢI - ÉP NỔI LÊN TRÊN CÙNG, CHỐNG BỊ CHE -->
    <div id="auth-container" style="position: fixed; top: 15px; right: 20px; z-index: 2147483647; pointer-events: auto;">
        <button id="google-login-btn" type="button" style="background: linear-gradient(135deg, #4285F4, #34A853); border: none; padding: 8px 16px; border-radius: 30px; color: white; font-weight: 600; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5); outline: none;">
            <span style="background: white; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #4285F4; font-size: 12px;">G</span>
            Đăng Nhập Google 🛡️
        </button>
    </div>

    <div class="game-container">
        <!-- TIÊU ĐỀ ĐẦY ĐỦ DẤU VÀ TÊN -->
        <h1 class="game-title">KHÔNG MỘT MÌNH 2026</h1>
        
        <!-- KHU VỰC CHƠI GAME CHÍNH -->
        <div id="game-play-area">
            <!-- Nơi chứa toàn bộ kịch bản và logic game của cậu -->
        </div>

        <!-- KHU VỰC ĐÁNH GIÁ TỪ CỘNG ĐỒNG -->
        <div class="feedback-section" style="margin-top: 35px; background: rgba(255,255,255,0.03); padding: 20px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(10px);">
            <h3 style="color: #fff; margin-bottom: 12px; font-size: 15px; text-align: left; display: flex; align-items: center; gap: 8px;">
                💬 Đánh Giá & Góp Ý Từ Cộng Đồng
            </h3>
            <textarea id="home-feedback-input" placeholder="Viết cảm nhận hoặc góp ý của cậu về game..." style="width: 100%; height: 70px; border-radius: 10px; padding: 12px; margin-bottom: 12px; background: rgba(0,0,0,0.4); color: #fff; border: 1px solid rgba(255,255,255,0.15); outline: none; box-sizing: border-box; font-family: inherit; font-size: 14px;"></textarea>
            <button onclick="submitHomeFeedback()" style="background: linear-gradient(135deg, #34d399, #059669); border: none; padding: 10px 20px; border-radius: 10px; font-weight: bold; cursor: pointer; color: #fff; box-shadow: 0 4px 15px rgba(52, 211, 153, 0.3); float: right; font-size: 14px; transition: opacity 0.2s;">Gửi Lên Mây ☁️</button>
            <div style="clear: both;"></div>
            
            <div id="global-feedback-list" style="margin-top: 20px; max-height: 180px; overflow-y: auto; text-align: left; font-size: 13px;">
                <!-- Danh sách đánh giá đồng bộ từ Firestore -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
