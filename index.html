<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Không Một Mình 2026</title>
    
    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-dark: #0d1117;
            --card-bg: rgba(255, 255, 255, 0.05);
            --border-glow: rgba(52, 211, 153, 0.3);
            --accent-green: #34d399;
            --accent-blue: #60a5fa;
            --text-main: #ffffff;
        }

        body {
            background-color: var(--bg-dark);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            background: linear-gradient(45deg, var(--accent-green), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.2rem;
            margin: 0 0 5px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .subtitle {
            color: #9ca3af;
            font-size: 0.9rem;
            margin: 0;
        }

        .main-container {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            .main-container { grid-template-columns: 1fr; }
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(10px);
        }

        .card h3 {
            margin-top: 0;
            color: var(--accent-green);
            font-size: 1.1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 8px;
        }

        /* Quiz Styles */
        .question-box {
            font-size: 1rem;
            margin-bottom: 12px;
            font-weight: 600;
            line-height: 1.4;
            min-height: 50px;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 9px 12px;
            border-radius: 8px;
            text-align: left;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        .option-btn:hover {
            background: rgba(52, 211, 153, 0.2);
            border-color: var(--accent-green);
        }

        .option-btn.correct {
            background: rgba(52, 211, 153, 0.4);
            border-color: var(--accent-green);
        }

        .option-btn.wrong {
            background: rgba(248, 113, 113, 0.4);
            border-color: #f87171;
        }

        .quiz-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        input[type="text"], textarea {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: #fff;
            padding: 10px;
            box-sizing: border-box;
            font-family: inherit;
            margin-bottom: 10px;
        }

        textarea {
            height: 75px;
            resize: none;
        }

        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-green);
        }

        .action-btn {
            background: linear-gradient(45deg, var(--accent-green), #10b981);
            color: #000;
            border: none;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
            transition: opacity 0.2s;
        }

        .action-btn:hover { opacity: 0.9; }

        .feedback-item {
            background: rgba(0, 0, 0, 0.25);
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 6px;
            border-left: 3px solid var(--accent-green);
            font-size: 0.9rem;
        }

        .feedback-item strong { color: var(--accent-blue); }

        #global-feedback-list {
            margin-top: 10px;
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <header>
        <h1>KHÔNG MỘT MÌNH 2026</h1>
        <p class="subtitle">Hệ thống Ôn tập & Kết nối Cộng đồng</p>
    </header>

    <div class="main-container">
        <!-- PHẦN 1: TRẮC NGHIỆM (TỰ LƯU TIẾN TRÌNH VÀO MÁY) -->
        <div class="card">
            <h3>🧠 Ôn Tập Trắc Nghiệm</h3>
            <div id="quiz-area">
                <div id="question-counter" style="font-size: 0.8rem; color: #9ca3af; margin-bottom: 6px;"></div>
                <div class="question-box" id="question-text">Đang tải câu hỏi...</div>
                <div class="options-list" id="options-container"></div>
                <div class="quiz-controls">
                    <span id="quiz-score" style="font-weight: bold; color: var(--accent-green); font-size: 0.95rem;">Điểm: 0</span>
                    <button class="action-btn" onclick="nextQuestion()">Câu Tiếp ➡️</button>
                </div>
            </div>
        </div>

        <!-- PHẦN 2: GÓP Ý CỘNG ĐỒNG (KHÔNG CẦN LOGIN) -->
        <div class="card">
            <h3>💬 Đánh Giá & Góp Ý</h3>
            <input type="text" id="author-name-input" placeholder="Tên cậu (hoặc để trống là Khách)">
            <textarea id="home-feedback-input" placeholder="Viết cảm nhận hoặc góp ý của cậu..."></textarea>
            <button class="action-btn" onclick="submitHomeFeedback()" style="width: 100%;">Gửi Lên Mây ☁️</button>

            <div id="global-feedback-list">
                Đang tải đánh giá...
            </div>
        </div>
    </div>

    <script>
        // --- FIREBASE FIRESTORE PUBLIC ---
        const firebaseConfig = {
            apiKey: "AIzaSyCtQSv6-wGiKyzIIzpmdL32f00Lz14ih1M",
            authDomain: "khongmotminh2026.firebaseapp.com",
            projectId: "khongmotminh2026",
            storageBucket: "khongmotminh2026.fireappstorage.app",
            messagingSenderId: "391078149804",
            appId: "1:391078149804:web:9ba69127156c66e6966909",
            measurementId: "G-BFXSCXN4Q0"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // --- DANH SÁCH CÂU HỎI ---
        const questionBank = [
            {
                q: "Đâu là thành phần cốt lõi để khởi tạo ứng dụng Firebase trong JavaScript?",
                options: ["firebase.initializeApp()", "firebase.start()", "firebase.run()", "firebase.init()"],
                correct: 0
            },
            {
                q: "Phương thức nào dùng để xác thực người dùng qua popup với Google trong Firebase Auth?",
                options: ["auth.loginPopup()", "auth.signInWithPopup()", "auth.googleLogin()", "auth.popupAuth()"],
                correct: 1
            },
            {
                q: "Trong Firestore, lệnh nào dùng để thêm một bản ghi mới vào collection?",
                options: ["db.collection().add()", "db.insert()", "db.pushData()", "db.createDoc()"],
                correct: 0
            },
            {
                q: "Khi lưu trữ trang web tĩnh lên GitHub Pages, file khởi tạo giao diện bắt buộc phải đặt tên là gì?",
                options: ["main.html", "home.html", "index.html", "app.html"],
                correct: 2
            },
            {
                q: "Thuộc tính 'apiKey' trong cấu hình Firebase dùng để làm gì?",
                options: ["Nhận diện dự án với Google Cloud", "Mã hóa mật khẩu tài khoản", "Bảo mật cơ sở dữ liệu", "Tăng tốc độ kết nối mạng"],
                correct: 0
            }
        ];

        // --- ĐỌC VÀ LƯU TIẾN TRÌNH CHƠI (LOCALSTORAGE) ---
        let currentQIndex = parseInt(localStorage.getItem('kmm_q_index')) || 0;
        let score = parseInt(localStorage.getItem('kmm_score')) || 0;
        let answered = false;

        function loadQuestion() {
            answered = false;
            if (currentQIndex >= questionBank.length) {
                currentQIndex = 0; // Vòng lặp lại nếu hết câu hỏi
            }
            
            let qData = questionBank[currentQIndex];
            document.getElementById('question-counter').innerText = `Câu hỏi ${currentQIndex + 1} / ${questionBank.length}`;
            document.getElementById('question-text').innerText = qData.q;
            document.getElementById('quiz-score').innerText = `Điểm: ${score}`;
            
            let optHtml = "";
            qData.options.forEach((opt, idx) => {
                optHtml += `<button class="option-btn" onclick="checkAnswer(${idx}, ${qData.correct})">${String.fromCharCode(65 + idx)}. ${opt}</button>`;
            });
            document.getElementById('options-container').innerHTML = optHtml;
        }

        window.checkAnswer = function(selected, correct) {
            if (answered) return;
            answered = true;
            let buttons = document.querySelectorAll('#options-container .option-btn');
            
            if (selected === correct) {
                buttons[selected].classList.add('correct');
                score += 10;
                localStorage.setItem('kmm_score', score);
                document.getElementById('quiz-score').innerText = `Điểm: ${score}`;
            } else {
                buttons[selected].classList.add('wrong');
                buttons[correct].classList.add('correct');
            }
        };

        window.nextQuestion = function() {
            currentQIndex = (currentQIndex + 1) % questionBank.length;
            localStorage.setItem('kmm_q_index', currentQIndex);
            loadQuestion();
        };

        // --- GỬI ĐÁNH GIÁ (KHÔNG CẦN ĐĂNG NHẬP) ---
        window.submitHomeFeedback = function() {
            const nameInput = document.getElementById('author-name-input');
            const textInput = document.getElementById('home-feedback-input');
            
            const authorName = nameInput ? (nameInput.value.trim() || "Khách ẩn danh") : "Khách ẩn danh";
            const text = textInput ? textInput.value.trim() : "";
            
            if (!text) {
                alert("Cậu vui lòng viết vài dòng đánh giá trước khi gửi nhé!");
                return;
            }

            db.collection("feedbacks").add({
                name: authorName,
                text: text,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                textInput.value = "";
                alert("❤️ Cảm ơn cậu đã gửi đánh giá lên hệ thống!");
                loadGlobalFeedbacks();
            }).catch((error) => {
                console.error("Lỗi gửi đánh giá:", error);
                alert("Chưa thể gửi đánh giá. Vui lòng kiểm tra lại kết nối mạng!");
            });
        };

        // --- TẢI ĐÁNH GIÁ CỘNG ĐỒNG ---
        function loadGlobalFeedbacks() {
            const listContainer = document.getElementById('global-feedback-list');
            if (!listContainer) return;

            db.collection("feedbacks").orderBy("timestamp", "desc").limit(10).get()
                .then((querySnapshot) => {
                    let html = "";
                    querySnapshot.forEach((doc) => {
                        let data = doc.data();
                        html += `<div class="feedback-item">
                            <strong>${data.name || "Khách"}:</strong> ${data.text}
                        </div>`;
                    });
                    listContainer.innerHTML = html || "<div style='color: #888; text-align: center; font-size: 0.85rem;'>Chưa có đánh giá nào.</div>";
                }).catch((err) => {
                    console.log("Lỗi tải đánh giá:", err);
                    listContainer.innerHTML = "<div style='color: #888; text-align: center; font-size: 0.85rem;'>Chưa thể tải dữ liệu từ Cloud.</div>";
                });
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadQuestion();
            loadGlobalFeedbacks();
        });
    </script>
</body>
</html>
