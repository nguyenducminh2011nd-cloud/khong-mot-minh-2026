<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Không Một Mình 2026</title>
    
    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-dark: #0d1117;
            --card-bg: rgba(255, 255, 255, 0.05);
            --border-glow: rgba(52, 211, 153, 0.3);
            --accent-green: #34d399;
            --accent-blue: #60a5fa;
            --text-main: #ffffff;
        }

        body {
            background-color: var(--bg-dark);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            background: linear-gradient(45deg, var(--accent-green), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.4rem;
            margin: 0 0 8px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .subtitle {
            color: #9ca3af;
            font-size: 0.95rem;
            margin: 0;
        }

        #auth-container {
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
        }

        .google-btn {
            background: #ffffff;
            color: #1f2937;
            border: none;
            padding: 10px 22px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.2s ease;
        }

        .google-btn:hover {
            background: #f3f4f6;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(52, 211, 153, 0.2);
        }

        .main-container {
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            padding: 22px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(10px);
        }

        .card h3 {
            margin-top: 0;
            color: var(--accent-green);
            font-size: 1.15rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        textarea {
            width: 100%;
            height: 90px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: #fff;
            padding: 12px;
            resize: none;
            margin-bottom: 12px;
            box-sizing: border-box;
            font-family: inherit;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent-green);
        }

        .submit-btn {
            background: linear-gradient(45deg, var(--accent-green), #10b981);
            color: #000;
            border: none;
            padding: 10px 24px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        .feedback-item {
            background: rgba(0, 0, 0, 0.25);
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 8px;
            border-left: 3px solid var(--accent-green);
            font-size: 0.92rem;
            line-height: 1.4;
        }

        .feedback-item strong {
            color: var(--accent-blue);
        }

        #global-feedback-list {
            margin-top: 15px;
            max-height: 250px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <header>
        <h1>KHÔNG MỘT MÌNH 2026</h1>
        <p class="subtitle">Dự án kết nối & chia sẻ cộng đồng</p>
    </header>

    <!-- NÚT ĐĂNG NHẬP GOOGLE -->
    <div id="auth-container">
        <button class="google-btn" onclick="loginWithGoogle()">
            <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.63-.06-1.25-.16-1.84H9v3.49h4.84c-.21 1.12-.86 2.07-1.83 2.71v2.25h2.96c1.73-1.59 2.73-3.93 2.73-6.61z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.96-2.25c-.82.55-1.87.88-3 .88-2.31 0-4.27-1.56-4.97-3.65H1.04v2.32C2.55 15.95 5.58 18 9 18z"/><path fill="#FBBC05" d="M4.03 10.78c-.18-.55-.28-1.13-.28-1.78s.1-1.23.28-1.78V4.9H1.04C.37 6.25 0 7.8 0 9.42s.37 3.17 1.04 4.52l2.99-2.32z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.47.89 11.43 0 9 0 5.58 0 2.55 2.05 1.04 4.9l2.99 2.32c.7-2.09 2.66-3.64 4.97-3.64z"/></svg>
            Đăng Nhập Google
        </button>
    </div>

    <div class="main-container">
        <!-- KHU VỰC GÓP Ý & ĐÁNH GIÁ -->
        <div class="card">
            <h3>💬 Đánh Giá & Góp Ý Từ Cộng Đồng</h3>
            <textarea id="home-feedback-input" placeholder="Viết cảm nhận hoặc góp ý của cậu về dự án..."></textarea>
            <button class="submit-btn" onclick="submitHomeFeedback()">Gửi Lên Mây ☁️</button>

            <div id="global-feedback-list">
                Đang tải đánh giá...
            </div>
        </div>
    </div>

    <script>
        // --- FIREBASE CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyCtQSv6-wGiKyzIIzpmdL32f00Lz14ih1M",
            authDomain: "khongmotminh2026.firebaseapp.com",
            projectId: "khongmotminh2026",
            storageBucket: "khongmotminh2026.fireappstorage.app",
            messagingSenderId: "391078149804",
            appId: "1:391078149804:web:9ba69127156c66e6966909",
            measurementId: "G-BFXSCXN4Q0"
        };

        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;

        // --- GOOGLE AUTHENTICATION ---
        window.loginWithGoogle = function() {
            console.log("Đang gọi đăng nhập Google...");
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider)
                .then((result) => {
                    console.log("Đăng nhập thành công:", result.user);
                })
                .catch((error) => {
                    console.error("Lỗi đăng nhập:", error);
                    alert("Lỗi đăng nhập: " + error.message);
                });
        };

        // --- SUBMIT FEEDBACK TO FIRESTORE ---
        window.submitHomeFeedback = function() {
            const input = document.getElementById('home-feedback-input');
            const text = input ? input.value.trim() : "";
            
            if (!text) {
                alert("Cậu vui lòng viết vài dòng đánh giá trước khi gửi nhé!");
                return;
            }

            let authorName = currentUser && currentUser.displayName ? currentUser.displayName : "Khách ẩn danh";

            db.collection("feedbacks").add({
                name: authorName,
                text: text,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                input.value = "";
                alert("❤️ Cảm ơn cậu đã gửi đánh giá!");
                loadGlobalFeedbacks();
            }).catch((error) => {
                console.error("Lỗi gửi đánh giá:", error);
                alert("Không thể gửi đánh giá do thiếu quyền hoặc lỗi mạng!");
            });
        };

        // --- LOAD FEEDBACKS FROM FIRESTORE ---
        function loadGlobalFeedbacks() {
            const listContainer = document.getElementById('global-feedback-list');
            if (!listContainer) return;

            db.collection("feedbacks").orderBy("timestamp", "desc").limit(10).get()
                .then((querySnapshot) => {
                    let html = "";
                    querySnapshot.forEach((doc) => {
                        let data = doc.data();
                        html += `<div class="feedback-item">
                            <strong>${data.name || "Khách"}:</strong> ${data.text}
                        </div>`;
                    });
                    listContainer.innerHTML = html || "<div style='color: #888; text-align: center;'>Chưa có đánh giá nào.</div>";
                }).catch((err) => {
                    console.log("Lỗi tải đánh giá:", err);
                    listContainer.innerHTML = "<div style='color: #888; text-align: center;'>Chưa thể tải dữ liệu từ Firestore.</div>";
                });
        }

        // --- AUTH STATE MONITOR ---
        auth.onAuthStateChanged((user) => {
            const authContainer = document.getElementById('auth-container');
            if (user) {
                currentUser = user;
                if (authContainer) {
                    authContainer.innerHTML = `
                        <div style="display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,0.8); padding: 8px 18px; border-radius: 30px; border: 1px solid var(--border-glow);">
                            <img src="${user.photoURL}" style="width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--accent-green);">
                            <div style="text-align: left; font-size: 13px; color: #fff;">
                                <strong>${user.displayName}</strong><br>
                                <span style="font-size: 10px; color: var(--accent-green);">Đã kết nối Cloud 🛡️</span>
                            </div>
                        </div>
                    `;
                }
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            loadGlobalFeedbacks();
        });
    </script>
</body>
</html>
