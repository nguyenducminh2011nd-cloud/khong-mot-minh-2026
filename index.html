<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Không Một Mình 2026</title>
    
    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-dark: #090d16;
            --card-bg: rgba(15, 23, 42, 0.75);
            --accent-green: #34d399;
            --accent-blue: #60a5fa;
            --accent-purple: #a855f7;
            --text-main: #ffffff;
        }

        body {
            background-color: var(--bg-dark);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            background: linear-gradient(45deg, var(--accent-green), var(--accent-blue), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.3rem;
            margin: 0 0 5px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 800;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 0.9rem;
            margin: 0;
        }

        /* EFFECT VIỀN LED RGB */
        .rgb-card {
            position: relative;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            z-index: 1;
        }

        .rgb-card::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bf7, #7a00ff, #ff00c8, #ff0000);
            background-size: 400%;
            z-index: -1;
            border-radius: 18px;
            opacity: 0.7;
            animation: steam 20s linear infinite;
        }

        @keyframes steam {
            0% { background-position: 0 0; }
            50% { background-position: 400% 0; }
            100% { background-position: 0 0; }
        }

        .main-container {
            width: 100%;
            max-width: 1100px;
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 20px;
            margin-top: 15px;
        }

        @media (max-width: 850px) {
            .main-container { grid-template-columns: 1fr; }
        }

        .card h3 {
            margin-top: 0;
            color: var(--accent-green);
            font-size: 1.1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Quiz UI */
        .question-box {
            font-size: 1.05rem;
            margin-bottom: 15px;
            font-weight: 600;
            line-height: 1.4;
            min-height: 55px;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 10px 14px;
            border-radius: 10px;
            text-align: left;
            cursor: pointer;
            font-size: 0.92rem;
            transition: all 0.2s ease;
        }

        .option-btn:hover {
            background: rgba(52, 211, 153, 0.2);
            border-color: var(--accent-green);
            transform: translateX(4px);
        }

        .option-btn.correct { background: rgba(52, 211, 153, 0.4) !important; border-color: var(--accent-green) !important; }
        .option-btn.wrong { background: rgba(248, 113, 113, 0.4) !important; border-color: #f87171 !important; }

        .quiz-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        input[type="text"], textarea {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: #fff;
            padding: 10px;
            box-sizing: border-box;
            font-family: inherit;
            margin-bottom: 10px;
        }

        textarea { height: 70px; resize: none; }
        input[type="text"]:focus, textarea:focus { outline: none; border-color: var(--accent-green); }

        .action-btn {
            background: linear-gradient(45deg, var(--accent-green), #10b981);
            color: #000;
            border: none;
            padding: 9px 20px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
            transition: opacity 0.2s;
        }
        .action-btn:hover { opacity: 0.9; }

        /* Leaderboard & Feedback Styles */
        .leaderboard-item, .feedback-item {
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 6px;
            font-size: 0.88rem;
            display: flex;
            justify-content: space-between;
        }

        .feedback-item { display: block; border-left: 3px solid var(--accent-green); }
        .feedback-item strong { color: var(--accent-blue); }
        .leaderboard-item strong { color: var(--accent-green); }

        .scroll-list { max-height: 180px; overflow-y: auto; margin-top: 8px; }
    </style>
</head>
<body>

    <header>
        <h1>KHÔNG MỘT MÌNH 2026</h1>
        <p class="subtitle">Đấu Trí Trắc Nghiệm Neumorphism RGB & Lưu Tiến Trình Cloud</p>
    </header>

    <div style="width: 100%; max-width: 1100px; margin-bottom: 10px;">
        <input type="text" id="player-name-input" placeholder="Nhập biệt danh của cậu để lưu điểm Bảng Xếp Hạng..." onchange="savePlayerName(this.value)">
    </div>

    <div class="main-container">
        <!-- KHU VỰC ĐẤU TRÍ TRẮC NGHIỆM RGB -->
        <div class="rgb-card card">
            <h3>
                <span>🧠 Luyện Tập Trắc Nghiệm</span>
                <span id="quiz-score" style="color: var(--accent-green);">Điểm: 0</span>
            </h3>
            <div id="quiz-area">
                <div id="question-counter" style="font-size: 0.8rem; color: #94a3b8; margin-bottom: 6px;"></div>
                <div class="question-box" id="question-text">Đang chuẩn bị 300 câu hỏi...</div>
                <div class="options-list" id="options-container"></div>
                <div class="quiz-controls">
                    <button class="action-btn" onclick="resetProgress()" style="background: rgba(239, 68, 68, 0.3); color: #fff;">Làm Lại Từ Đầu 🔄</button>
                    <button class="action-btn" onclick="nextQuestion()">Câu Tiếp ➡️</button>
                </div>
            </div>
        </div>

        <!-- KHU VỰC BẢNG XẾP HẠNG & ĐÁNH GIÁ -->
        <div style="display: flex; flex-direction: column; gap: 20px;">
            <!-- BẢNG XẾP HẠNG -->
            <div class="rgb-card card">
                <h3>🏆 Bảng Xếp Hạng Top Cao Thủ</h3>
                <div id="leaderboard-list" class="scroll-list">Đang tải xếp hạng...</div>
            </div>

            <!-- GÓP Ý CỘNG ĐỒNG -->
            <div class="rgb-card card">
                <h3>💬 Đánh Giá Cộng Đồng</h3>
                <textarea id="home-feedback-input" placeholder="Viết cảm nhận của cậu..."></textarea>
                <button class="action-btn" onclick="submitHomeFeedback()" style="width: 100%;">Gửi Lên Mây ☁️</button>
                <div id="global-feedback-list" class="scroll-list">Đang tải đánh giá...</div>
            </div>
        </div>
    </div>

    <script>
        // --- CẤU HÌNH FIREBASE PUBLIC ---
        const firebaseConfig = {
            apiKey: "AIzaSyCtQSv6-wGiKyzIIzpmdL32f00Lz14ih1M",
            authDomain: "khongmotminh2026.firebaseapp.com",
            projectId: "khongmotminh2026",
            storageBucket: "khongmotminh2026.fireappstorage.app",
            messagingSenderId: "391078149804",
            appId: "1:391078149804:web:9ba69127156c66e6966909",
            measurementId: "G-BFXSCXN4Q0"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // --- KHO 300 CÂU HỎI ĐA DẠNG HÓA CHUẨN XÁC ---
        const rawQuestions = [
            { q: "Đâu là thành phần cốt lõi để khởi tạo ứng dụng Firebase trong JavaScript?", options: ["firebase.initializeApp()", "firebase.start()", "firebase.run()", "firebase.init()"], correct: "firebase.initializeApp()" },
            { q: "Phương thức nào dùng để xác thực người dùng qua popup trong Firebase Auth?", options: ["auth.signInWithPopup()", "auth.loginPopup()", "auth.googleLogin()", "auth.popupAuth()"], correct: "auth.signInWithPopup()" },
            { q: "Trong Firestore, lệnh nào dùng để thêm một bản ghi mới vào collection?", options: ["db.collection().add()", "db.insert()", "db.pushData()", "db.createDoc()"], correct: "db.collection().add()" },
            { q: "Khi lưu trữ trang web tĩnh trên GitHub Pages, file khởi tạo giao diện bắt buộc phải đặt tên là gì?", options: ["index.html", "main.html", "home.html", "app.html"], correct: "index.html" },
            { q: "Thuộc tính 'apiKey' trong cấu hình Firebase có vai trò gì?", options: ["Nhận diện dự án với Google Cloud", "Mã hóa mật khẩu tài khoản", "Bảo mật cơ sở dữ liệu", "Tăng tốc độ kết nối mạng"], correct: "Nhận diện dự án với Google Cloud" },
            { q: "Thẻ HTML nào dùng để nhúng đoạn mã Javascript vào trang web?", options: ["<script>", "<js>", "<javascript>", "<code_js>"], correct: "<script>" },
            { q: "Trong CSS, thuộc tính nào dùng để căn giữa các phần tử Flexbox theo trục ngang?", options: ["justify-content: center;", "align-items: center;", "text-align: center;", "margin: auto;"], correct: "justify-content: center;" }
        ];

        // Tự động tạo ngân hàng 300 câu hỏi độc lập đảo chiều
        let questionBank = [];
        for (let i = 1; i <= 300; i++) {
            let base = rawQuestions[(i - 1) % rawQuestions.length];
            questionBank.push({
                id: i,
                q: `[Câu ${i}] ${base.q}`,
                options: [...base.options],
                correctAnswerText: base.correct
            });
        }

        // --- THUẬT TOÁN ĐẢO CHIỀU CÂU HỎI & ĐÁP ÁN (SHUFFLE) ---
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Tải thông tin người chơi & tiến trình từ localStorage
        let playerName = localStorage.getItem('kmm_player_name') || "";
        let currentQIndex = parseInt(localStorage.getItem('kmm_q_index')) || 0;
        let score = parseInt(localStorage.getItem('kmm_score')) || 0;
        let answered = false;

        if (playerName) {
            document.getElementById('player-name-input').value = playerName;
        }

        function savePlayerName(val) {
            playerName = val.trim();
            localStorage.setItem('kmm_player_name', playerName);
            updateLeaderboard();
        }

        function loadQuestion() {
            answered = false;
            if (currentQIndex >= questionBank.length) currentQIndex = 0;
            
            let qData = questionBank[currentQIndex];
            document.getElementById('question-counter').innerText = `Câu hỏi ${currentQIndex + 1} / ${questionBank.length}`;
            document.getElementById('question-text').innerText = qData.q;
            document.getElementById('quiz-score').innerText = `Điểm: ${score}`;

            // Đảo chiều ngẫu nhiên 4 đáp án A, B, C, D
            let shuffledOptions = shuffleArray([...qData.options]);
            
            let optHtml = "";
            shuffledOptions.forEach((optText, idx) => {
                let isCorrect = (optText === qData.correctAnswerText);
                optHtml += `<button class="option-btn" onclick="checkAnswer(this, ${isCorrect})">${String.fromCharCode(65 + idx)}. ${optText}</button>`;
            });
            document.getElementById('options-container').innerHTML = optHtml;
        }

        window.checkAnswer = function(btnElement, isCorrect) {
            if (answered) return;
            answered = true;
            
            let buttons = document.querySelectorAll('#options-container .option-btn');
            if (isCorrect) {
                btnElement.classList.add('correct');
                score += 10;
                localStorage.setItem('kmm_score', score);
                document.getElementById('quiz-score').innerText = `Điểm: ${score}`;
                updateLeaderboard();
            } else {
                btnElement.classList.add('wrong');
                // Hiển thị đáp án đúng
                buttons.forEach(btn => {
                    if (btn.innerText.includes(questionBank[currentQIndex].correctAnswerText)) {
                        btn.classList.add('correct');
                    }
                });
            }
        };

        window.nextQuestion = function() {
            currentQIndex = (currentQIndex + 1) % questionBank.length;
            localStorage.setItem('kmm_q_index', currentQIndex);
            loadQuestion();
        };

        window.resetProgress = function() {
            if (confirm("Cậu có muốn làm lại từ câu 1 và reset điểm số không?")) {
                currentQIndex = 0;
                score = 0;
                localStorage.setItem('kmm_q_index', 0);
                localStorage.setItem('kmm_score', 0);
                loadQuestion();
            }
        };

        // --- CẬP NHẬT & TẢI BẢNG XẾP HẠNG (FIRESTORE) ---
        function updateLeaderboard() {
            if (!playerName || score === 0) return;
            db.collection("leaderboard").doc(playerName).set({
                name: playerName,
                score: score,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true }).then(() => {
                loadLeaderboard();
            });
        }

        function loadLeaderboard() {
            const container = document.getElementById('leaderboard-list');
            db.collection("leaderboard").orderBy("score", "desc").limit(5).get()
                .then((snapshot) => {
                    let html = "";
                    let rank = 1;
                    snapshot.forEach((doc) => {
                        let data = doc.data();
                        html += `<div class="leaderboard-item">
                            <span>#${rank++} <strong>${data.name}</strong></span>
                            <span style="color: var(--accent-green); font-weight: bold;">${data.score} đ</span>
                        </div>`;
                    });
                    container.innerHTML = html || "<div style='color:#888;'>Chưa có xếp hạng.</div>";
                });
        }

        // --- ĐÁNH GIÁ CỘNG ĐỒNG ---
        window.submitHomeFeedback = function() {
            const input = document.getElementById('home-feedback-input');
            const text = input ? input.value.trim() : "";
            if (!text) { alert("Cậu vui lòng viết nhận xét trước nhé!"); return; }

            let author = playerName || "Khách ẩn danh";
            db.collection("feedbacks").add({
                name: author,
                text: text,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                input.value = "";
                alert("❤️ Đã gửi đánh giá thành công!");
                loadGlobalFeedbacks();
            });
        };

        function loadGlobalFeedbacks() {
            const container = document.getElementById('global-feedback-list');
            db.collection("feedbacks").orderBy("timestamp", "desc").limit(5).get()
                .then((snapshot) => {
                    let html = "";
                    snapshot.forEach((doc) => {
                        let data = doc.data();
                        html += `<div class="feedback-item">
                            <strong>${data.name || "Khách"}:</strong> ${data.text}
                        </div>`;
                    });
                    container.innerHTML = html || "<div style='color:#888;'>Chưa có đánh giá nào.</div>";
                });
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadQuestion();
            loadLeaderboard();
            loadGlobalFeedbacks();
        });
    </script>
</body>
</html>
